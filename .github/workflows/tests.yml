name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows 是主要使用環境（注音使用者多在 Windows），Linux 一併驗證跨平台。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Self-test (keyboard table + known cases)
        run: python scripts/decode_bopomofo.py --selftest
        env:
          PYTHONUTF8: '1'

      - name: Run test suite
        run: python tests/run_tests.py
        env:
          PYTHONUTF8: '1'

      - name: Verify UTF-8 stdout is not mangled
        # 回歸測試：先前在 Windows CP950 主控台下輸出會變亂碼，
        # 呼叫端必須自己補 PYTHONIOENCODING 重跑一次。這裡刻意不設任何編碼變數。
        run: python scripts/decode_bopomofo.py --text "su3cl3a8"
